name: Build Android APK Secure

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Discord Token Securely
      env:
        SECRET_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        sed -i "s/DEFAULT_TOKEN/$SECRET_BOT_TOKEN/g" main.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Install Android SDK dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libtool autoconf automake libltdl-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblldb-dev libffi-dev liblzma-dev uuid-dev git zip unzip

    - name: Initialize Buildozer
      run: |
        buildozer init || true
        # Ghim phiên bản kivy=2.3.0 (hoặc 2.2.1) để tương thích tuyệt đối với python-for-android
        sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0,requests,certifi,urllib3,idna,charset-normalizer,filetype/' buildozer.spec
        sed -i 's/#android.permissions =.*/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/#android.architectures =.*/android.architectures = arm64-v8a/' buildozer.spec

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
